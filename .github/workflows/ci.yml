# 质量检查：lint、类型检查、格式检查、构建、密钥扫描。
# 公开仓库的 Actions 分钟不计费，所以 PR 和 dev 推送都跑。
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # CI 里不需要 git hooks
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      # 每个 PR 都按生产方式组装一次部署制品，提前发现打包问题（.env 混入、符号链接越界、超大小）
      - run: bash scripts/build/pack-artifact.sh "$RUNNER_TEMP/artifact.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ github.sha }}
          path: ${{ runner.temp }}/artifact.tar.gz
          retention-days: 1

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
