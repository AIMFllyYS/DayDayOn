<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 奶油手账纸背景 -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FBF2E6" />
      <stop offset="100%" stop-color="#F5E4D0" />
    </linearGradient>

    <!-- 陶土朱砂印泥渐变 -->
    <linearGradient id="sealInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D41" />
      <stop offset="50%" stop-color="#C53E26" />
      <stop offset="100%" stop-color="#992612" />
    </linearGradient>

    <!-- 烫金内芯渐变 -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="40%" stop-color="#FCD369" />
      <stop offset="100%" stop-color="#D99E28" />
    </linearGradient>

    <!-- 印章真实下压阴影 -->
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#802110" flood-opacity="0.28" />
    </filter>

    <filter id="innerDeboss">
      <feOffset dx="1" dy="2" />
      <feGaussianBlur stdDeviation="2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#551206" flood-opacity="0.35" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- 图标底板 -->
  <rect width="512" height="512" rx="116" fill="url(#paperBg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
  <rect width="512" height="512" rx="116" fill="none" stroke="#E3C9B0" stroke-width="2" stroke-opacity="0.6" />

  <!-- 手账纸微点阵（5x5 点阵，优雅退后） -->
  <g fill="#A8754E" opacity="0.12">
    <circle cx="76" cy="76" r="3.5" /><circle cx="166" cy="76" r="3.5" /><circle cx="256" cy="76" r="3.5" /><circle cx="346" cy="76" r="3.5" /><circle cx="436" cy="76" r="3.5" />
    <circle cx="76" cy="166" r="3.5" /><circle cx="166" cy="166" r="3.5" /><circle cx="346" cy="166" r="3.5" /><circle cx="436" cy="166" r="3.5" />
    <circle cx="76" cy="256" r="3.5" /><circle cx="436" cy="256" r="3.5" />
    <circle cx="76" cy="346" r="3.5" /><circle cx="166" cy="346" r="3.5" /><circle cx="346" cy="346" r="3.5" /><circle cx="436" cy="346" r="3.5" />
    <circle cx="76" cy="436" r="3.5" /><circle cx="166" cy="436" r="3.5" /><circle cx="256" cy="436" r="3.5" /><circle cx="346" cy="436" r="3.5" /><circle cx="436" cy="436" r="3.5" />
  </g>

  <!-- 主体印章（微旋 -5 度，模拟真实盖章的手作温度） -->
  <g transform="rotate(-5 256 256)" filter="url(#stampShadow)">
    <!-- 印章朱泥外轮廓（带手工木雕般微有机的柔和弧度） -->
    <path d="M 256 76 C 365 74, 436 145, 436 256 C 438 368, 366 438, 256 436 C 144 438, 74 366, 76 256 C 74 146, 145 74, 256 76 Z" fill="url(#sealInkGrad)" />

    <!-- 印章边沿压凹内圈白描边线 -->
    <path d="M 256 94 C 352 92, 418 158, 418 256 C 420 354, 354 420, 256 418 C 158 420, 92 354, 94 256 C 92 158, 158 92, 256 94 Z" fill="none" stroke="#FFF7ED" stroke-width="6" stroke-linecap="round" stroke-dasharray="32 8 48 8" opacity="0.85" />

    <!-- 内部压凹印章图形：超级 D 符号 + 治愈晨阳 + 完成对勾 -->
    <!-- 中间白奶油底衬 -->
    <circle cx="256" cy="256" r="138" fill="#FFF7ED" />

    <!-- 烫印纹饰：大写字母 D 融合晨曦与打卡勾 -->
    <!-- D 躯干：温润圆角竖柱 -->
    <rect x="180" y="172" width="28" height="168" rx="14" fill="url(#sealInkGrad)" />

    <!-- D 的右半圆弧：融合初升旭日 -->
    <path d="M 194 172 C 275 172, 332 208, 332 256 C 332 304, 275 340, 194 340 Z" fill="none" stroke="url(#sealInkGrad)" stroke-width="28" stroke-linejoin="round" />

    <!-- 核心对勾（Check! 任务达成的笃定喜悦） -->
    <path d="M 206 258 L 244 294 L 320 206" fill="none" stroke="url(#goldAccent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerDeboss)" />

    <!-- 印章上方小字刻印：DAY DAY ON -->
    <path id="textArc" d="M 150 256 A 106 106 0 0 1 362 256" fill="none" />
    <!-- 8 芒星（金色光芒） -->
    <g transform="translate(256, 138) scale(0.9)" fill="url(#goldAccent)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" />
    </g>
  </g>

  <!-- 印章右下角飞溅出的手作金色微尘星屑 -->
  <circle cx="430" cy="180" r="4" fill="#F5C95E" />
  <circle cx="410" cy="120" r="6" fill="#F5C95E" opacity="0.75" />
  <circle cx="370" cy="80" r="3.5" fill="#F5C95E" opacity="0.8" />
  <circle cx="100" cy="380" r="5" fill="#C53E26" opacity="0.4" />
</svg>