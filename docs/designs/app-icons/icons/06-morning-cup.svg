<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景：暖意融融的晨光焦糖浅渐变 -->
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FCEEE0" />
      <stop offset="100%" stop-color="#F2D8C0" />
    </linearGradient>

    <!-- 陶瓷杯身质感渐变 -->
    <linearGradient id="ceramicCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF5EA" />
      <stop offset="100%" stop-color="#EEDAC5" />
    </linearGradient>

    <!-- 焦糖咖啡液体渐变 -->
    <radialGradient id="coffeeLiquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A56E4A" />
      <stop offset="70%" stop-color="#7A4928" />
      <stop offset="100%" stop-color="#552F15" />
    </radialGradient>

    <!-- 打卡热气勾渐变 -->
    <linearGradient id="steamCheckGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="40%" stop-color="#FF7A38" />
      <stop offset="85%" stop-color="#E6441D" />
      <stop offset="100%" stop-color="#BA2908" />
    </linearGradient>

    <filter id="cupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#804B2A" flood-opacity="0.22" />
    </filter>

    <filter id="steamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF5C26" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- 图标底板 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad6)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
  <rect width="512" height="512" rx="116" fill="none" stroke="#E3C4A8" stroke-width="2" stroke-opacity="0.6" />

  <!-- 杯底暖影 -->
  <ellipse cx="236" cy="425" rx="140" ry="20" fill="#99603D" opacity="0.18" />

  <!-- 杯托浅盘（木质小杯垫） -->
  <ellipse cx="236" cy="415" rx="160" ry="24" fill="#DDBFA6" stroke="#C8A588" stroke-width="3" />
  <ellipse cx="236" cy="413" rx="140" ry="18" fill="#ECD3BE" />

  <!-- 咖啡杯主体 -->
  <g filter="url(#cupShadow)">
    <!-- 杯把手 -->
    <path d="M 330 260 C 395 260, 400 350, 320 360" fill="none" stroke="url(#ceramicCup)" stroke-width="26" stroke-linecap="round" />
    <path d="M 330 260 C 395 260, 400 350, 320 360" fill="none" stroke="#E0C6AE" stroke-width="3" stroke-linecap="round" />

    <!-- 胖嘟嘟的陶瓷杯身 -->
    <path d="M 120 230 C 120 340, 160 400, 236 400 C 312 400, 352 340, 352 230 Z" fill="url(#ceramicCup)" stroke="#EBD3BD" stroke-width="2" />

    <!-- 杯口椭圆轮廓 -->
    <ellipse cx="236" cy="230" rx="116" ry="32" fill="#FAF0E3" stroke="#DEC1A6" stroke-width="2" />
    <!-- 内部焦糖咖啡液面 -->
    <ellipse cx="236" cy="232" rx="104" ry="26" fill="url(#coffeeLiquid)" />
    <!-- 拿铁拉花小爱心 -->
    <path d="M 236 244 C 236 244, 218 226, 218 214 C 218 205, 226 198, 236 206 C 246 198, 254 205, 254 214 C 254 226, 236 244, 236 244 Z" fill="#FFF2E0" opacity="0.85" />

    <!-- 杯身手绘小萌脸（治愈微笑） -->
    <ellipse cx="195" cy="320" rx="6" ry="7" fill="#6B4B32" />
    <circle cx="197" cy="318" r="2" fill="#FFFFFF" />
    <ellipse cx="277" cy="320" rx="6" ry="7" fill="#6B4B32" />
    <circle cx="279" cy="318" r="2" fill="#FFFFFF" />
    <!-- 腮红 -->
    <ellipse cx="178" cy="328" rx="10" ry="6" fill="#FFA592" opacity="0.7" />
    <ellipse cx="294" cy="328" rx="10" ry="6" fill="#FFA592" opacity="0.7" />
    <!-- 猫猫嘴 -->
    <path d="M 226 325 Q 236 332 246 325" fill="none" stroke="#6B4B32" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 杯口升腾而起的热气 —— 完美的飞扬 Checkmark 对勾！ -->
  <g filter="url(#steamGlow)">
    <!-- 辅助柔和白色蒸汽束 -->
    <path d="M 180 200 C 170 160, 195 140, 205 110" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    
    <!-- 主蒸汽对勾（厚重、有弹性、充满自信与力量） -->
    <path d="M 172 135 L 222 185 C 240 160, 310 80, 370 65" fill="none" stroke="url(#steamCheckGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 对勾高光内线 -->
    <path d="M 178 135 L 222 178 C 240 156, 306 82, 362 70" fill="none" stroke="#FFF1B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- 勾尖点亮的小太阳星芒 -->
  <g transform="translate(378, 62)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFA534" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- 随蒸汽飘散的小温暖光点 -->
  <circle cx="280" cy="115" r="4.5" fill="#FFA24C" opacity="0.7" />
  <circle cx="340" cy="130" r="3.5" fill="#FFC966" opacity="0.8" />
</svg>