# 第一阶段（HTTPS 证书签发前）。安装位置：/www/server/panel/vhost/nginx/daydayon.husteread.com.conf
# 只开放 ACME 验证路径，其余请求返回 503；证书签发后换成 nginx-daydayon.conf。
server {
    listen 80;
    server_name daydayon.husteread.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/daydayon/webroot;
        default_type text/plain;
    }

    location / {
        return 503;
    }

    access_log /www/wwwlogs/daydayon.husteread.com.log;
    error_log /www/wwwlogs/daydayon.husteread.com.error.log;
}
