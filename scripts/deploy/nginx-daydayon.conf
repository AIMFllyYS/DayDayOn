# 正式站点。安装位置：/www/server/panel/vhost/nginx/daydayon.husteread.com.conf
# 证书由 acme.sh 签发并安装到 /www/server/panel/vhost/cert/daydayon.husteread.com/，自动续期后执行 nginx -s reload。
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name daydayon.husteread.com;

    ssl_certificate /www/server/panel/vhost/cert/daydayon.husteread.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/daydayon.husteread.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 前端压缩后的图片通常小于 1MB，这里留出余量
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/daydayon/webroot;
        default_type text/plain;
    }

    location / {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        proxy_pass http://127.0.0.1:3043;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 用对端地址覆盖客户端自带的 X-Forwarded-For，应用据此做 IP 限流，防止伪造
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # AI 流式响应：不缓冲，超时放宽
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    access_log /www/wwwlogs/daydayon.husteread.com.log;
    error_log /www/wwwlogs/daydayon.husteread.com.error.log;
}
