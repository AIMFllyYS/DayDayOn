# 本地开发数据库：pnpm db:up / pnpm db:down。与服务器同版本（scripts/deploy/docker-compose.db.yml）
# 只绑定本机回环地址；数据在仓库根目录的 .data/postgres（已 gitignore）
name: daydayon-dev

services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: daydayon-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daydayon
      POSTGRES_DB: daydayon
      # 仅本地开发使用的固定口令，不用于任何服务器
      POSTGRES_PASSWORD: daydayon-dev
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
    ports:
      # 数据库端口，约定见 docs/conventions/ports.md
      - '127.0.0.1:23432:5432'
    volumes:
      # PostgreSQL 18 的官方镜像挂载点是 /var/lib/postgresql；路径相对本文件
      - ../../.data/postgres:/var/lib/postgresql
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daydayon -d daydayon']
      interval: 5s
      timeout: 5s
      retries: 10
